name: S4P secret leakage guard
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  gitleaks:
    name: Scan introduced changes for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check committed history for exposed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'
