name: S4P production external read-only smoke
on:
  workflow_dispatch:
  schedule:
    # Every 6 hours: verify live PostgreSQL and signed private Supabase evidence readiness.
    - cron: '23 1,7,13,19 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s4p-production-external-smoke.yml'
      - 'backend/app/api/routes/health.py'
      - 'backend/app/api/routes/auth.py'
      - 'Dockerfile.render'
permissions:
  contents: read
jobs:
  external-http:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      S4P_URL: https://s4p-erp-api.onrender.com
    steps:
      - name: Verify HTTPS production site and backend readiness without secrets
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          origin = os.environ['S4P_URL'].rstrip('/')
          assert origin.startswith('https://')
          def request(path, method='GET'):
              req = urllib.request.Request(
                  origin + path, method=method,
                  headers={'Accept': 'application/json' if path.startswith('/api/') else 'text/html',
                           'User-Agent': 'S4P-read-only-smoke/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=35) as r:
                      return r.status, r.headers.get('Content-Type', ''), r.read(65536)
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get('Content-Type', ''), e.read(65536)

          # On Render's free tier an idle service may need a cold start.
          last = None
          for attempt in range(5):
              try:
                  status, ct, body = request('/api/readyz')
                  if status == 200 and 'application/json' in ct:
                      state = json.loads(body)
                      assert state.get('status') == 'ok', state
                      break
                  last = f'/api/readyz returned HTTP {status} with {ct}'
              except Exception as exc:
                  last = type(exc).__name__
              time.sleep(12)
          else:
              raise AssertionError(f'Production readiness unavailable: {last}')

          s, typ, body = request('/')
          assert s == 200 and 'text/html' in typ and b'<html' in body.lower(), 'SPA is not served by FastAPI'
          s, typ, body = request('/api/auth/me')
          assert s == 401 and 'application/json' in typ, 'Unauthenticated session endpoint must return 401 JSON'
          s, typ, body = request('/api/healthz')
          assert s == 200 and json.loads(body).get('status') == 'ok'
          s, typ, body = request('/api/backupz')
          assert s == 200 and 'application/json' in typ and json.loads(body).get('status') == 'ok', (
              'Recent encrypted offsite database backup is missing or stale'
          )
          print('PASS: HTTPS app, private Supabase evidence, recent encrypted backup, database and session protection')
          PY
