name: S4P dependency vulnerability guard
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '12 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - name: Reject known vulnerabilities in runtime dependencies
        run: python -m pip_audit -r backend/requirements.txt
  npm-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Reject high and critical vulnerabilities
        run: npm audit --audit-level=high
        working-directory: frontend
