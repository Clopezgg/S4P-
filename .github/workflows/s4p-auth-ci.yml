name: S4P authentication regressions
on:
  push:
    branches: [main]
    paths:
      - 'backend/app/api/routes/auth.py'
      - 'backend/app/api/csrf.py'
      - 'backend/app/services/bootstrap_service.py'
      - 'backend/tests/test_auth.py'
      - '.github/workflows/s4p-auth-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test
      APP_ENV: testing
      SECRET_KEY: ci-only-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Prepare isolated PostgreSQL schema
        env:
          PGPASSWORD: nexora
        run: psql -h localhost -U nexora -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE nexora_test_s4p;'
      - name: Verify login, bootstrap, lockout, cookies, CSRF and logout
        run: pytest -q tests/test_auth.py
