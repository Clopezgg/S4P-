name: S4P original NEXORA source parity
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'brand/**'
      - 'scripts/check_nexora_parity.py'
      - '.github/workflows/s4p-source-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned original NEXORA read-only
        run: |
          git clone --quiet https://github.com/Clopezgg/nexora-group.git /tmp/nexora-parity-source
          git -C /tmp/nexora-parity-source checkout --quiet 2ca980446654f3c92e3ddb1e8f55d847ef073968
      - name: Verify no source code or brand assets lost
        run: python3 scripts/check_nexora_parity.py
