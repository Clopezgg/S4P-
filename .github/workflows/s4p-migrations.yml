name: S4P FastAPI database migration smoke
on:
  push:
    branches: [main]
    paths:
      - 'backend/alembic/**'
      - 'backend/app/core/config.py'
      - 'backend/app/models/**'
      - '.github/workflows/s4p-migrations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_migrations
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_migrations
      APP_ENV: testing
      SECRET_KEY: ephemeral-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply ALL Alembic migrations to a fresh real PostgreSQL
        run: alembic upgrade head
      - name: Verify migration version and business tables exist
        env:
          PGPASSWORD: nexora
        run: |
          alembic current
          psql -h localhost -U nexora -d nexora_migrations -v ON_ERROR_STOP=1 -Atc \
            "SELECT CASE WHEN to_regclass('public.alembic_version') IS NULL THEN 1 ELSE 0 END" \
            | grep -qx 0
          psql -h localhost -U nexora -d nexora_migrations -v ON_ERROR_STOP=1 -Atc \
            "SELECT CASE WHEN to_regclass('public.companies') IS NULL OR to_regclass('public.users') IS NULL THEN 1 ELSE 0 END" \
            | grep -qx 0
