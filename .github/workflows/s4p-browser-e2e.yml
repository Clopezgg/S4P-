name: S4P authenticated browser critical journeys
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/s4p-browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/s4p-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    name: Browser + PostgreSQL + private evidence E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        env:
          AZURITE_ACCOUNTS: nexorae2e:bmV4b3JhLWUyZS1henVyaXRlLXNoYXJlZC1rZXktMDAwMQ==
        ports:
          - 10000:10000
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: nexora
      PGPASSWORD: nexora
      APP_ENV: testing
      SECRET_KEY: e2e-test-only-never-deploy-to-production
      E2E_AZURE_STORAGE_CONNECTION_STRING: 'DefaultEndpointsProtocol=http;AccountName=nexorae2e;AccountKey=bmV4b3JhLWUyZS1henVyaXRlLXNoYXJlZC1rZXktMDAwMQ==;BlobEndpoint=http://127.0.0.1:10000/nexorae2e;'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend in isolated virtual environment
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install real browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Execute end-to-end project, financial, accessibility and browser scenarios
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve failure evidence (no customer data: isolated DB)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: s4p-browser-test-evidence
          path: |
            frontend/e2e-report/
            frontend/test-results/
            frontend/e2e/visual/
          if-no-files-found: ignore
          retention-days: 7
