name: S4P authenticated browser critical journeys
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/s4p-browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/s4p-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    name: Browser + PostgreSQL + private evidence E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [functional, visual]
    # Full SAP/visual matrix spans nine viewport widths plus three browser engines.
    # Preserve every assertion while allowing this integration run to finish.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: nexora
      APP_ENV: testing
      SECRET_KEY: e2e-test-only-never-deploy-to-production
      E2E_AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend in isolated virtual environment
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install real browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify that no Playwright spec is omitted from the two suites
        working-directory: frontend
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const suites = {
            functional: [
              'accessibility.spec.ts',
              'critical-journey.spec.ts',
              'cross-browser-critical.spec.ts',
              'overdue-installment-payment.spec.ts',
              'sap-gui-theme.spec.ts',
            ],
            visual: ['sap-gui-visual.spec.ts', 'visual-audit.spec.ts'],
          }
          const assigned = Object.values(suites).flat().sort()
          const actual = fs.readdirSync('e2e').filter((name) => name.endsWith('.spec.ts')).sort()
          if (JSON.stringify(actual) !== JSON.stringify(assigned)) {
            throw new Error('E2E spec inventory changed; update suite matrix to retain full coverage')
          }
          NODE
      - name: Execute end-to-end project, financial, accessibility and browser scenarios
        working-directory: frontend
        env:
          S4P_E2E_SUITE: ${{ matrix.suite }}
        run: |
          if [ "$S4P_E2E_SUITE" = "visual" ]; then
            npx playwright test e2e/sap-gui-visual.spec.ts e2e/visual-audit.spec.ts
          else
            npx playwright test e2e/accessibility.spec.ts e2e/critical-journey.spec.ts e2e/cross-browser-critical.spec.ts e2e/overdue-installment-payment.spec.ts e2e/sap-gui-theme.spec.ts
          fi
      - name: Preserve isolated QA failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: s4p-browser-test-evidence-${{ matrix.suite }}
          path: |
            frontend/e2e-report/
            frontend/test-results/
            frontend/e2e/visual/
          if-no-files-found: ignore
          retention-days: 7
