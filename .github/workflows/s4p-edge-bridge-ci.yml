name: S4P signed private evidence bridge
on:
  push:
    branches: [main]
    paths:
      - "backend/app/integrations/supabase_edge_storage.py"
      - "backend/app/integrations/azure_blob.py"
      - "backend/app/core/config.py"
      - "backend/tests/test_supabase_edge_storage.py"
      - "backend/verify_evidence_storage.py"
      - ".github/workflows/s4p-edge-bridge-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DATABASE_URL: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test
      SECRET_KEY: ci-only-bridge-tests-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check storage security and contracts
        run: |
          ruff check app/integrations/supabase_edge_storage.py app/core/config.py tests/test_supabase_edge_storage.py
          pytest -q tests/test_supabase_edge_storage.py tests/test_supabase_evidence_adapter.py tests/test_evidence_storage.py
