# S4P backend — Render Blueprint
# Git source: Clopezgg/S4P-
# Render automatically resolves DATABASE_URL from its managed Postgres resource.
# This file does not contain passwords or manually assembled connection strings.
#
# NOTE: The existing resources were created outside a Blueprint. This file
# does not apply until linked/synced through Render Blueprints. Preview
# changes and confirm resource adoption to avoid duplicate services.
services:
  - type: web
    name: s4p-erp-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /api/readyz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: s4p-postgres-staging
          property: connectionString
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://s4p-erp-api.onrender.com
      # Keep the service's existing SECRET_KEY during Blueprint adoption.
      # For a new instance, the dashboard prompts for the secret securely.
      - key: SECRET_KEY
        sync: false
      - key: EDIT_ACCESS_REQUIRED
        value: "true"
      - key: EDIT_ACCESS_TOKEN_SALT
        sync: false
      - key: EDIT_ACCESS_TOKEN_DIGEST
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Ed25519 private signing key stays only on Render. Supabase stores
      # the corresponding public verification key and its own API secrets.
      - key: EVIDENCE_BACKEND
        value: supabase_edge
      - key: EVIDENCE_CONTAINER_NAME
        value: s4p-evidence-private
      - key: SUPABASE_EDGE_BRIDGE_URL
        value: https://klnfxzyccohplnzbdecy.supabase.co/functions/v1/s4p-evidence-bridge
      - key: SUPABASE_EDGE_SIGNING_KEY_B64
        sync: false

databases:
  - name: s4p-postgres-staging
    plan: free
    region: virginia
    databaseName: s4p_postgres_staging
